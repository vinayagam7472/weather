<!DOCTYPE html>
<html>
<head>
  <title>Weather App</title>
</head>
<style>
  *{
    padding: 0;
    margin: 0;
  }
 * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #cfd9df, #2c3e50);
}

.container {
  width: 380px;
  padding: 30px;
  text-align: center;
  background: #1f2933;
  border-radius: 20px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
  transition: 0.3s;
}

.container:hover {
  transform: translateY(-5px);
}

h2 {
  margin-bottom: 20px;
  color: #f1f5f9;
  font-weight: 600;
}

#city {
  width: 100%;
  padding: 12px;
  border: 1px solid #3a4750;
  border-radius: 10px;
  font-size: 15px;
  outline: none;
  margin-bottom: 15px;
  background: #2c3e50;
  color: #f1f5f9;
  transition: 0.3s;
}

#city::placeholder {
  color: #94a3b8;
}

#city:focus {
  border-color: #4a90e2;
  box-shadow: 0 0 6px rgba(74, 144, 226, 0.4);
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #4a90e2;
  color: #ffffff;
  font-size: 15px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #357abd;
}

#result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: #273444;
  color: #e2e8f0;
  font-size: 16px;
  line-height: 1.6;
  min-height: 60px;
  white-space: pre-line;
  border: 1px solid #3a4750;
}
</style>
<body>
  <div class="container">
  <h2>Weather Checker</h2>

  <input type="text" id="city" placeholder="Enter city name"><br>
  <button onclick="getWeather()">Check Weather</button>

  <h3 id="result"></h3>
</div>
  <script >
    async function getWeather() {
  let city = document.getElementById("city").value;

  let apiKey = "521a939c0510c59da62b684279d4f584"; // replace this

  let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

  try {
    let response = await fetch(url);

    let data = await response.json();

    console.log(data);
      
    if (data.cod === 200){
      document.getElementById("result").innerText =
        `Temperature: ${data.main.temp}°C
         Weather: ${data.weather[0].main}`;
    } else {
      document.getElementById("result").innerText = "City not found ";
    }

  } catch (error) {
    console.log(error);
    document.getElementById("result").innerText = "Error fetching data ";
  }
}
  </script>

</body>
</html>
